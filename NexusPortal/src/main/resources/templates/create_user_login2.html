<script>
$(document).ready(function(){
	$( "#val-custprovince" ).change(function() {
		var brcode =  $( "#val-custprovince option:selected" ).val();
		
		//alert(brcode);
		$( "#val-district" ).empty();
		 
		$.ajax({url: "/NexusClient/districtList", 
			  type: "get",
			  data: { 
				  provinceid: brcode 
				    
				  },
			  success: function(result){

				  var y1 ='<option th:value='+"0"+'>'+"Please select District "+'</option>';
				  $('#val-district').append(y1);
				  jQuery.each( result, function( i, val ) {
					 //alert(val.areadescription); id name_en th:text="${i.name_en}"
					 var y ='<option value='+val.id+' th:value='+val.id+'th:text='+val.name_en+' >'+val.name_en+'</option>';
					 $('#val-district').append(y);	 
					});
				  }});
		});
});
</script>
