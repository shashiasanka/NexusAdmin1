<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title></title>
<link rel="stylesheet" href="template/vendors_x/simple-line-icons/css/simple-line-icons.css">
    <link rel="stylesheet" href="template/vendors_x/flag-icon-css/css/flag-icon.min.css">
    <link rel="stylesheet" href="template/vendors_x/css/vendor.bundle.base.css">
    <!-- endinject -->
    <!-- Plugin css for this page -->
    <!-- End plugin css for this page -->
    <!-- inject:css -->
    <!-- endinject -->
    <!-- Layout styles -->
    <link rel="stylesheet" href="template/css_x/style.css" /> <!-- End layout styles -->
    <link rel="shortcut icon" href="template/images_x/favicon.png" />
</head>
<body>
<div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo">
                  <img src="template/images/nex1.svg">
                </div>
                <h4></h4>
                <h6 class="font-weight-light">Sign in to continue.</h6>
                <form action="#" th:action="@{/Loging}" th:object="${logingData}" method="post">
                  <div class="form-group">
                    <input type="text" class="form-control form-control-lg" id="username" th:field="*{username}" placeholder="Username">
                  </div>
                  <div class="form-group">
                    <input type="password" class="form-control form-control-lg" id="password" th:field="*{password}" placeholder="Password">
                  </div>
                  <div class="mt-3">
                  <input type="submit" value="SIGN IN" class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn" />
                    
                  </div>
                  <div class="my-2 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                      <label class="form-check-label text-muted">
                        <input type="checkbox" class="form-check-input"> Keep me signed in </label>
                    </div>
                    <a href="#" class="auth-link text-black">Forgot password?</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
      </div>
      <!-- page-body-wrapper ends -->
    </div>
   
</body>
</html>
