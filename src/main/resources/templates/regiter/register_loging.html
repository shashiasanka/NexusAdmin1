<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<link rel="stylesheet"
	href="template/vendors/simple-line-icons/css/simple-line-icons.css">
<link rel="stylesheet"
	href="template/vendors/flag-icon-css/css/flag-icon.min.css">
<link rel="stylesheet"
	href="template/vendors/css/vendor.bundle.base.css">
<link rel="stylesheet" href="template/css/style.css">
<link rel="shortcut icon" href="template/images/favicon.png" />

<script src="loging/vendor/jquery/jquery-3.2.1.min.js"></script>

</head>
<body>
	<div class="container-scroller">
		<div class="container-fluid page-body-wrapper full-page-wrapper">
			<div class="content-wrapper d-flex align-items-center auth">
				<div class="row flex-grow">
					<div class="col-lg-4 mx-auto">
						<div class="auth-form-light text-left p-5">
							<div class="brand-logo">
								<img src="../../images/logo.svg">
							</div>
							<h4>Bank Details</h4>

							<form action="#" th:action="@{/registerdetails4}"
								th:object="${registerData}" method="post">

								
								<div id="individual">
									<div class="form-group">
										<label>Username</label> <input type="text"
											class="form-control form-control-lg" id="username"
											name="username" th:field="*{username}">
									</div>
																		
									<div class="form-group">
										<label> Password </label> <input type="password"
											class="form-control form-control-lg" id="password"
											th:field="*{password}" name="password">
									</div>
									<div class="form-group">
										<label> Confirm password </label> <input type="password"
											class="form-control form-control-lg" id="confirmpassword"
											name="confirmpassword" th:field="*{confirmpassword}">
									</div>
								</div>

								
								<div class="mb-4">
									<div class="form-check">
										<label class="form-check-label text-muted"> <input
											type="checkbox" class="form-check-input"> I agree to
											all Terms & Conditions
										</label>
									</div>
								</div>
								<div class="mt-3">

									<input type="submit"
										class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn"
										value=" Submit " />
								</div>
								
							</form>
						</div>
					</div>
				</div>
			</div>
			<!-- content-wrapper ends -->
		</div>
		<!-- page-body-wrapper ends -->
	</div>
</body>
</html>
